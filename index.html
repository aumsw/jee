<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE Main Mock Test</title>
<style>
:root{--n9:#061a33;--n8:#0b2545;--c5:#06b6d4;--c3:#67e8f9;--bg:#f1f9fc;--mut:#5a7291;--ok:#16a34a;--bad:#dc2626;--mk:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--n8);user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(6,26,51,.15);padding:28px;max-width:640px;width:100%}
h1{margin:0 0 4px;font-size:24px}h2{margin:0 0 10px;font-size:19px}h4{margin:14px 0 6px;font-size:13px;color:var(--mut)}
ul{padding-left:18px;line-height:1.65;font-size:14px;color:#33496a}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--c5);color:var(--n9)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#e2eef5;color:var(--n8)}.btn.red{background:var(--bad);color:#fff}
.fld{position:relative;margin:10px 0}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;padding:11px 12px;border:2px solid #d6e8f0;border-radius:10px;font-size:15px;color:var(--n8);outline:0;background:#fff}
.fld input:focus{border-color:var(--c5)}
.sgb{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #cfe3ec;border-radius:10px;box-shadow:0 8px 24px rgba(6,26,51,.18);z-index:20;max-height:230px;overflow:auto;margin-top:2px}
.sg{padding:9px 12px;cursor:pointer;font-size:14px}.sg:hover,.sg.on{background:#e0f7fb}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.hint{font-size:11px;color:var(--mut);margin-top:3px}
header{background:var(--n8);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px}
header small{color:#9fb6d3}
.timer{font:700 22px ui-monospace,Consolas,monospace;color:var(--c3)}.timer.low{color:#fca5a5}
.tabs{display:flex;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid #d6e8f0}
.tab{border:1px solid #cfe3ec;background:#fff;border-radius:20px;padding:6px 16px;font-weight:600;cursor:pointer;color:var(--n8)}
.tab.on{background:var(--c5);border-color:var(--c5);color:var(--n9)}
.main{display:grid;grid-template-columns:1fr 310px;gap:16px;padding:16px 18px}
.q{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(6,26,51,.08)}
.qh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px}
#qtext{font-size:17px;line-height:1.6;margin:0 0 14px}
#qtext .fig{margin:10px 0;color:var(--n8)}
.opt{display:block;width:100%;text-align:left;background:#f6fbfd;border:2px solid #d6e8f0;border-radius:10px;padding:11px 14px;margin-bottom:9px;font-size:16px;cursor:pointer;color:var(--n8)}
.opt b{display:inline-block;width:26px;color:var(--c5)}.opt.sel{border-color:var(--c5);background:#e0f7fb}
.numbox{max-width:300px}
#num{width:100%;font-size:22px;padding:10px 12px;border:2px solid var(--c5);border-radius:10px;text-align:right;font-family:ui-monospace,Consolas,monospace;color:var(--n8)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.kp button{padding:11px 0;font-size:17px;font-weight:700;border:1px solid #cbd9e2;background:#eef3f6;border-radius:8px;cursor:pointer;color:var(--n8)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
aside{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(6,26,51,.08);align-self:start;max-height:calc(100vh - 130px);overflow:auto}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pb{border:1px solid #cbd9e2;background:#eef3f6;border-radius:8px;height:36px;font-weight:700;cursor:pointer;color:var(--n8);display:inline-block;min-width:36px;text-align:center;line-height:34px}
.pb.a{background:var(--ok);color:#fff;border-color:var(--ok)}.pb.v{background:var(--bad);color:#fff;border-color:var(--bad)}
.pb.m{background:var(--mk);color:#fff;border-color:var(--mk)}.pb.cur{outline:3px solid var(--c5)}
.leg{font-size:12px;color:var(--mut);margin-top:14px;line-height:2.1}.leg .pb{height:22px;min-width:22px;line-height:20px;font-size:11px;cursor:default}
.ov{position:fixed;inset:0;background:rgba(6,26,51,.9);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:100%;text-align:center}
.big{font-size:68px;font-weight:800;color:var(--bad);line-height:1.1;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}th,td{padding:8px;border-bottom:1px solid #e1edf3;text-align:center}th:first-child,td:first-child{text-align:left}
.mt td,.mt th{border:1px solid #cfe3ec;padding:5px 10px;text-align:left}
.score{font-size:44px;font-weight:800;color:var(--c5)}
details{margin-top:12px;font-size:14px}.rv{padding:8px 0;border-bottom:1px solid #e1edf3;line-height:1.5}
.g{color:var(--ok);font-weight:700}.r{color:var(--bad);font-weight:700}
.stat{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin:10px 0}
.stat.ok{background:#dcfce7;color:#166534}.stat.bad{background:#fee2e2;color:#991b1b}.stat.wait{background:#e0f2fe;color:#075985}
@media(max-width:820px){.main{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
#repWrap{position:absolute;left:-12000px;top:0;width:740px}
@media print{body>*:not(#repWrap){display:none!important}#repWrap{position:static!important;width:auto!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<!-- ===== Start screen: student details ===== -->
<div id="start" class="center"><div class="card">
  <h1>JEE Main Mock Test</h1>
  <p style="margin:0 0 8px;color:var(--mut)">Physics • Chemistry • Mathematics</p>
  <div class="fld"><label>STUDENT NAME</label><input id="fName" placeholder="Enter your full name" maxlength="60" autocomplete="off"></div>
  <div class="row2">
    <div class="fld"><label>STATE</label><input id="fState" placeholder="Type to search and select" autocomplete="off"><div class="sgb hidden" id="sState"></div></div>
    <div class="fld"><label>CITY</label><input id="fCity" placeholder="Select a state first" autocomplete="off"><div class="sgb hidden" id="sCity"></div></div>
  </div>
  <div class="fld"><label>SCHOOL NAME</label><input id="fSchool" placeholder="Type your school name" autocomplete="off"><div class="sgb hidden" id="sSchool"></div>
    <div class="hint">If your school is not in the list, type its full name — it will appear as a suggestion next time.</div></div>
  <div class="err" id="fErr"></div>
  <ul id="rules"></ul>
  <button class="btn" id="go" style="width:100%;margin-top:10px;font-size:16px">START EXAM</button>
</div></div>

<!-- ===== Exam ===== -->
<div id="exam" class="hidden">
  <header>
    <div><b>JEE Main Mock Test</b><br><small id="who"></small></div>
    <span id="viol">Warnings: 0/2</span>
    <span class="timer" id="timer">00:00:00</span>
    <button class="btn red" id="subBtn">Submit Paper</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <section class="q">
      <div class="qh"><span id="qno"></span><span id="qsub"></span></div>
      <div id="qtext"></div>
      <div id="opts"></div>
      <div class="nav">
        <button class="btn sec" id="prev">Previous</button>
        <button class="btn sec" id="mark">Mark for Review &amp; Next</button>
        <button class="btn sec" id="clr">Clear Answer</button>
        <button class="btn" id="next">Save &amp; Next</button>
      </div>
    </section>
    <aside id="pal"></aside>
  </div>
</div>

<div id="result" class="center hidden"></div>
<div id="repWrap"><div id="rep"></div></div>

<div id="alert" class="ov hidden"><div class="box">
  <h2 id="aT"></h2><p id="aM" style="color:var(--mut)"></p>
  <div class="big" id="aC"></div>
  <button class="btn" id="aB" style="width:100%">RETURN TO EXAM (FULL SCREEN)</button>
</div></div>

<div id="conf" class="ov hidden"><div class="box">
  <h2>Submit the paper?</h2><p id="cM" style="color:var(--mut)"></p>
  <button class="btn sec" id="cN">Cancel</button> <button class="btn red" id="cY">Yes, Submit</button>
</div></div>

<script>
// ===================== SETTINGS =====================
const CFG = {
  examName: 'UT-04 (31/10/26)',
  minutes: 180,
  maxWarn: 2,     // allowed warnings (each time the student leaves the exam screen). The 3rd exit = instant submit
  grace: 10,      // seconds allowed to return after leaving the screen
  final: 5,       // extra final-countdown seconds, then auto-submit
  plus: 4, minus: 1,
  numMinus: 1,    // Numerical galat jawab pe minus marks (0 kar do agar negative nahi chahiye)
  sheetURL: 'https://script.google.com/macros/s/AKfycbyniEd_4CxPjJ7AwQyBQVUVVexIAJiMY_Czl5tzFHo1vURLcv8b06Bsh4a6uAAs6W9Yxw/exec'   // <-- Code.gs deploy karke yahan paste karein
};
const SUB = { P: 'Physics', C: 'Chemistry', M: 'Mathematics' };

// ===================== QUESTIONS (75) =====================
//==QDATA START
const Q = [];
const mc = (s, q, o, a, f) => Q.push({ s, t: 'm', q, o, a, f: f || '' });
const nm = (s, q, a, f) => Q.push({ s, t: 'n', q, a, f: f || '' });
const S12 = ['Both Statement-I and Statement-II are true', 'Both Statement-I and Statement-II are false', 'Statement-I is true but Statement-II is false', 'Statement-I is false but Statement-II is true'];
const S12n = ['Both Statement-1 and Statement-2 are true.', 'Statement-1 is true, but Statement-2 is false.', 'Statement-1 is false, but Statement-2 is true.', 'Both Statement-1 and Statement-2 are false.'];
const TF = ['Both statements are TRUE', 'Both statements are FALSE', 'I is TRUE and II is FALSE', 'I is FALSE and II is TRUE'];

// ---------- Figures ----------
const svg = (w, h, body) => '<div class="fig"><svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" style="max-width:100%;height:auto" fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui,sans-serif" font-size="13">' + body + '</svg></div>';
const FIG2 = svg(260, 270,
  '<path d="M40 60h60M140 20h60" stroke-dasharray="3 3"/><path d="M70 60v90M170 20v130"/><circle cx="120" cy="150" r="50"/><circle cx="120" cy="150" r="4" fill="currentColor"/>' +
  '<path d="M120 150v55"/><rect x="90" y="205" width="60" height="30" fill="#e0f7fb"/><text x="120" y="225" text-anchor="middle" stroke="none" fill="currentColor">10 kN</text>' +
  '<text x="10" y="110" stroke="none" fill="currentColor">600 mm</text><text x="182" y="90" stroke="none" fill="currentColor">900 mm</text>');
const FIG7 = svg(220, 190,
  '<path d="M40 10v150h110V10M80 10v110h30V10"/><path d="M40 160h110" stroke-width="3"/>' +
  '<rect x="41" y="40" width="39" height="119" fill="#bae6fd" stroke="none"/><rect x="80" y="120" width="30" height="39" fill="#bae6fd" stroke="none"/><rect x="110" y="40" width="39" height="119" fill="#94a3b8" stroke="none"/><rect x="41" y="40" width="108" height="0"/>' +
  '<path d="M20 40h150" stroke-dasharray="4 3"/><text x="52" y="100" stroke="none" fill="currentColor">ρw</text><text x="123" y="100" stroke="none" fill="currentColor">ρ</text>' +
  '<path d="M170 160v-39M165 124l5-5 5 5M165 157l5 5 5-5" /><text x="176" y="146" stroke="none" fill="currentColor">2 cm</text>');
const FIG8 = svg(260, 200,
  '<path d="M40 10v140h160V10M80 10v110h80V10"/><rect x="41" y="40" width="39" height="109" fill="#bae6fd" stroke="none"/><rect x="80" y="120" width="80" height="29" fill="#bae6fd" stroke="none"/><rect x="161" y="70" width="39" height="79" fill="#bae6fd" stroke="none"/>' +
  '<path d="M40 175h160M40 168v14M200 168v14"/><text x="112" y="193" stroke="none" fill="currentColor">L</text><path d="M215 90h35M243 84l7 6-7 6"/><text x="228" y="80" stroke="none" fill="currentColor" font-style="italic">a</text>');
const FIG9 = svg(280, 220,
  '<rect x="40" y="20" width="50" height="100" fill="#bae6fd"/><path d="M20 120h120v14H20z" fill="#cbd5e1"/><path d="M60 134v66M100 134v66"/><path d="M10 200h250"/>' +
  '<path d="M92 135C140 130 170 160 180 198" stroke-dasharray="4 3"/><path d="M200 30v168M195 36l5-6 5 6M195 192l5 6 5-6"/><text x="210" y="120" stroke="none" fill="currentColor">x</text>' +
  '<text x="6" y="75" stroke="none" fill="currentColor">2H</text><text x="146" y="170" stroke="none" fill="currentColor">H</text><path d="M110 212h70M118 207l-6 5 6 5M172 207l6 5-6 5"/><text x="140" y="210" stroke="none" fill="currentColor" dy="-4">R</text>');
const FIG11 = svg(220, 200,
  '<path d="M96 28A70 70 0 1 0 124 28" stroke-width="14" stroke="#7dd3fc"/><circle cx="110" cy="100" r="3" fill="currentColor"/><path d="M110 100l-61 35" stroke-width="1.5"/>' +
  '<text x="70" y="108" stroke="none" fill="currentColor" font-style="italic">r</text><text x="104" y="14" stroke="none" fill="currentColor" font-style="italic">x</text><path d="M92 20h36" stroke-width="1.5"/><text x="116" y="196" stroke="none" fill="currentColor" font-style="italic">d</text>');
const FIG22 = svg(340, 120,
  '<path d="M60 30h130c30 0 40 22 70 22h70M60 90h130c30 0 40-22 70-22h70" /><rect x="50" y="26" width="14" height="68" fill="#e0f7fb"/><path d="M20 60h30M42 54l8 6-8 6"/><text x="12" y="48" stroke="none" fill="currentColor">piston</text><text x="262" y="100" stroke="none" fill="currentColor">outlet</text>');

// ---------- PHYSICS (Q1-25) ----------
mc('P', 'A load of 4 kg is suspended from a ceiling through a steel wire of length 20 m and radius 2 mm. It is found that the length of the wire increases by 0.031 mm, as equilibrium is achieved. If g = 3.1π m s⁻², the value of Young\'s modulus of the material of the wire (in N m⁻²) is', ['2×10¹²', '4×10¹¹', '2×10¹¹', '0.02×10⁹'], 0);
mc('P', 'A load of 10 kN is supported from a pulley, which in turn is supported by a rope of cross-sectional area 10³ mm² and modulus of elasticity 10³ N mm⁻² as shown in the figure. Neglecting friction at the pulley, then downward deflection of the load (in mm) is', ['3.75', '4.25', '2.75', '4.00'], 0, FIG2);
mc('P', 'The area of cross section of the rope used to lift a load by a crane is 2.5×10⁻⁴ m². The maximum lifting capacity of the crane is 10 metric tons. To increase the lifting capacity of the crane to 25 metric tons, the required area of cross section of the rope should be: (take g = 10 m s⁻²)', ['6.25×10⁻⁴ m²', '10×10⁻⁴ m²', '1×10⁻⁴ m²', '1.67×10⁻⁴ m²'], 0);
mc('P', 'The Young\'s modulus of a steel wire of length 6 m and cross-sectional area 3 mm² is 2×10¹¹ N/m². The wire is suspended from its support on a given planet. A block of mass 4 kg is attached to the free end of the wire. The acceleration due to gravity on the planet is ¼ of its value on the earth. The elongation of wire is (Take g on the earth = 10 m/s²):', ['0.1 cm', '1 cm', '0.1 mm', '1 mm'], 2);
mc('P', 'A small ball (mass m) falling under gravity in a viscous medium experience a drag force proportional to the instantaneous speed u such that F<sub>drag</sub> = ku. Then the terminal speed of ball within viscous medium is (Ignore force of buoyancy)', ['k/(mg)', 'mg/k', '√(mg/k)', 'None of these'], 1);
mc('P', 'The work done to split a liquid drop of radius R into N identical drops is (take σ as the surface tension of the liquid)', ['4πR²(N<sup>1/3</sup> − 1)σ', '4πR²Nσ', '4πR²(N<sup>1/2</sup> − 1)σ', 'None of these'], 0);
mc('P', 'The figure represents a U-tube of uniform cross-section filled with two immiscible liquids. One is water with density ρ<sub>w</sub> and the other liquid is of density ρ. The liquid interface lies 2 cm above the base. The relation between ρ and ρ<sub>w</sub> is', ['ρ = ρ<sub>w</sub>', 'ρ = 1.02 ρ<sub>w</sub>', 'ρ = 1.2 ρ<sub>w</sub>', 'None of these'], 0, FIG7);
mc('P', 'A liquid stands at the plane level in the U-tube when at rest. If areas of cross-section of both the limbs are equal, what will be the difference in heights h of the liquid in the two limbs of U-tube, when the system is given an acceleration a in horizontal direction towards right as shown?', ['Lg/a', 'La/g', 'Lg²/a²', 'zero'], 1, FIG8);
mc('P', 'A tank is filled up to a height 2H with a liquid and is placed on a platform of height H from the ground. The distance x from the ground where a small hole is punched to get the maximum range R is', ['H', '1.25 H', '1.5 H', '2 H'], 2, FIG9);
mc('P', 'A water drop of radius 1 cm is broken into 729 equal droplets. If surface tension of water is 75 dyne/cm, then the gain in surface energy will be: (Given π = 3.14)', ['8.5×10⁻⁴ J', '8.2×10⁻⁴ J', '7.5×10⁻⁴ J', '5.3×10⁻⁴ J'], 2);
mc('P', 'A cylindrical metal rod of length L₀ is shaped into a ring with a small gap as shown. On heating the system:', ['x decreases, r and d increase', 'x and r increase, d decreases', 'x, r and d all increase', 'Data is insufficient to arrive at a conclusion'], 2, FIG11);
mc('P', 'The coefficient of apparent expansion of mercury in a glass vessel is 153×10⁻⁶ /°C and that in a steel vessel is 144×10⁻⁶ /°C. If α for steel is 12×10⁻⁶ /°C, then that of glass is', ['9×10⁻⁶ /°C', '6×10⁻⁶ /°C', '36×10⁻⁶ /°C', '27×10⁻⁶ /°C'], 0);
mc('P', 'A hot metallic sphere of radius r radiates heat. Its rate of cooling is', ['independent of r', 'proportional to r', 'proportional to r²', 'proportional to 1/r'], 3);
mc('P', 'Two rods of same length and material transfer a given amount of heat in 12 seconds, when they are joined end to end. But when they are joined along their lengths, then they will transfer same heat in same conditions in', ['24 s', '3 s', '1.5 s', '48 s'], 1);
mc('P', 'The energy spectrum of a black body exhibits maximum energy around a wavelength λ₀. The temperature of the black body is now changed such that the energy is maximum around a wavelength 3λ₀/4. The power radiated by the black body will now increase by a factor of', ['256/81', '64/27', '16/9', '4/3'], 0);
mc('P', 'When a capillary tube is immersed in a liquid, then liquid of mass M rises in the capillary tube. If capillary tube of triple radius is taken the mass of liquid rising in tube is', ['M/2', '2M', 'M/3', '3M'], 3);
mc('P', 'Two balls of same material whose radii are in the ratio of 1 : 2 falls in a liquid. The ratio of their terminal velocities is given by', ['2 : 3', '1 : 4', '3 : 2', '5 : 9'], 1);
mc('P', 'Water rises in the two capillaries of same material up to height of 30 and 60 mm. The ratio of the radii of the capillaries is (Assume h ≫ r)', ['2 : 1', '3 : 5', '5 : 4', '4 : 7'], 0);
mc('P', 'Two wires of the same material have lengths in the ratio 1 : 2 and their radii are in the ratio 1 : √2. If they are stretched by applying equal forces, the increase in their lengths will be in the ratio', ['√2 : 2', '2 : √2', '1 : 1', '1 : 2'], 2);
mc('P', 'A calorimeter of heat capacity 100 J/K is at room temperature of 30 °C. 100 g of water at 40 °C of specific heat 4200 J/kg-K is poured into calorimeter. The final temperature of water in calorimeter is', ['30 °C', '42 °C', '38.0 °C', '20.6 °C'], 2);
nm('P', 'A pressure-pump has a horizontal tube of cross sectional area 10 cm² for the outflow of water at a speed of 20 m/s. The force [in N] exerted on the vertical wall just in front of the tube which stops water horizontally flowing out of the tube, is : [given: density of water = 1000 kg/m³]', 400);
nm('P', 'Figure below shows a liquid being pushed out of the tube by a piston having area of cross section 2.0 cm². The area of cross section at the outlet is 10 mm². If the piston is pushed at a speed of 4 cm s⁻¹ the speed of outgoing fluid is _______ (in cm s⁻¹)', 80, FIG22);
nm('P', 'If a thermometer reads freezing point of water as 20 °C and boiling point as 150 °C, how much thermometer would read when the actual temperature is 60 °C?', 98);
nm('P', 'A lead bullet of 10 g travelling at 300 m/s strikes against a block of wood and comes to rest. Assuming 50% of heat is absorbed by the bullet, the increase in its temperature is [in °C] (Specific heat of lead = 150 J/kg-K)', 150);
nm('P', 'A ball of thermal capacity 10 cal/°C is heated to the temperature of furnace. It is then transferred into a vessel containing water. The water equivalent of vessel and the contents is 200 g. The temperature of the vessel and its contents rise from 10 °C to 40 °C. What is the temperature of furnace? [in °C]', 640);

// ---------- CHEMISTRY (Q26-50) ----------
mc('C', 'The element with Z = 120 (not yet discovered) will be an/a', ['Inner transition metal', 'Alkaline earth metal', 'Alkali metal', 'Transition metal'], 1);
mc('C', 'The extra stability of half-filled subshell is due to:<br>(a) Symmetrical distribution of electrons<br>(b) Smaller coulombic repulsion energy<br>(c) The presence of electrons with the same spin in non-degenerate orbitals<br>(d) Larger exchange energy<br>(e) Relatively smaller shielding of electrons by one another<br>Identify the correct statements', ['(b), (d) and (e) only', '(a), (b), (d) and (e) only', '(b), (c) and (d) only', '(a), (b) and (d) only'], 1);
mc('C', 'The correct order of second ionisation potential of carbon, nitrogen, oxygen and fluorine is', ['C&gt;N&gt;O&gt;F', 'O&gt;N&gt;F&gt;C', 'O&gt;F&gt;N&gt;C', 'F&gt;O&gt;N&gt;C'], 2);
mc('C', 'The element with the highest first ionisation potential is', ['boron', 'carbon', 'nitrogen', 'oxygen'], 2);

  inp.addEventListener('input', show);

  inp.addEventListener('blur', () => setTimeout(() => box.classList.add('hidden'), 150));
}

// Random paper for every student: questions are shuffled inside each subject/section and MCQ options are shuffled too
function shuffleExam() {
  const sh = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const groups = {};
  Q.forEach((q, i) => (groups[q.s + q.t] = groups[q.s + q.t] || []).push(i));
  Object.values(groups).forEach(pos => {
    const items = sh(pos.map(i => Q[i]));
    pos.forEach((p, k) => Q[p] = items[k]);
  });
  Q.forEach(q => {
    if (q.t !== 'm' || q.o.some(o => /none of these|all of the above/i.test(o))) return;
    const perm = sh(q.o.map((_, i) => i));          // perm[newIndex] = original index
    q.o = perm.map(i => q.o[i]); q.a = perm.indexOf(q.a); q.perm = perm;
  });
}

function beep() {

  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.3);
}
function startBeep() { beep(); beepT = setInterval(beep, 600); }
function stopBeep() { clearInterval(beepT); }

// ===================== Leaving-screen detection =====================
function chk() {
  if (!run) return;
  const ok = !!document.fullscreenElement && !document.hidden && document.hasFocus();
  if (!ok && !viol) {
    viol = Date.now(); vN++;
    if (vN > CFG.maxWarn) {   // 3rd exit -> instant submit
      $('viol').textContent = 'Warnings: ' + CFG.maxWarn + '/' + CFG.maxWarn;
      submit('You have crossed the limit of ' + CFG.maxWarn + ' warnings, so your paper has been submitted automatically.', 'Auto-submit (crossed ' + CFG.maxWarn + '-warning limit)');
      return;
    }
    $('viol').textContent = 'Warnings: ' + vN + '/' + CFG.maxWarn;
    $('alert').classList.remove('hidden');
    startBeep(); tick();
  } else if (ok && viol) {
    viol = 0;
    $('alert').classList.add('hidden');
    stopBeep();
  }
}
['fullscreenchange', 'visibilitychange'].forEach(e => document.addEventListener(e, chk));
['blur', 'focus'].forEach(e => addEventListener(e, chk));

// ===================== Timer + warning countdown (real time) =====================
function tick() {
  const now = Date.now(), left = Math.max(0, endAt - now), s = Math.ceil(left / 1000);
  $('timer').textContent = [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(x => String(x).padStart(2, '0')).join(':');
  $('timer').classList.toggle('low', s < 300);
  if (left <= 0) { submit('Time is up. Your paper was submitted automatically.', 'Time up'); return; }
  if (viol) {
    const e = (now - viol) / 1000;
    if (e >= CFG.grace + CFG.final) { submit('You stayed away from the exam screen, so your paper was auto-submitted.', 'Auto-submit (left screen)'); return; }
    if (e >= CFG.grace) {
      $('aT').textContent = '⚠ FINAL COUNTDOWN — Paper will be submitted!';
      $('aM').textContent = 'You did not return to the exam screen. Auto-submit in';
      $('aC').textContent = Math.ceil(CFG.grace + CFG.final - e);
    } else {
      $('aT').textContent = '⚠ WARNING ' + vN + ' of ' + CFG.maxWarn + ' — You left the exam screen!';
      $('aM').textContent = (vN >= CFG.maxWarn ? 'This was your LAST warning. If you leave the exam screen once more, your paper will be submitted immediately. ' : '') + 'Return to the exam screen within';
      $('aC').textContent = Math.ceil(CFG.grace - e);
    }
  }
}

async function post(body, noCors) {
  const opt = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body };
  if (noCors) opt.mode = 'no-cors';
  return fetch(CFG.sheetURL, opt);
}
async function saveResult() {
  const st = $('saveStat'), rb = $('retry');
  st.className = 'stat wait'; st.textContent = 'Saving your result…'; rb.classList.add('hidden');
  if (!CFG.sheetURL || CFG.sheetURL.includes('PASTE')) { fail('Sheet URL is not configured. Result is saved only in this browser.'); return; }
  const body = JSON.stringify(lastPayload);
  try {
    const r = await post(body, false), j = await r.json();
    if (j.ok) { okMsg(); return; }
    fail('Server error: ' + (j.error || 'unknown'));
  } catch (e) {
    try { await post(body, true); okMsg(true); }   // duplicate-safe (id se), response read nahi ho paya
    catch (e2) { fail('Internet/connection problem. Please try again.'); }
  }
  function okMsg(unsure) { st.className = 'stat ok'; st.textContent = '✓ Result saved successfully' + (unsure ? ' (sent)' : '') + '. Please download your report below.'; }
  function fail(t) { st.className = 'stat bad'; st.textContent = '⚠ ' + t; rb.classList.remove('hidden'); }
}

// ===================== Personal PDF report (built on the student's own device; never uploaded) =====================
function buildReport(STAT, T, tot, C, W, U) {
  const endT = Date.now(), p2 = n => String(n).padStart(2, '0');
  const fmtD = t => { const d = new Date(t); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear(); };
  const fmtT = t => { const d = new Date(t); let hh = d.getHours(); const ap = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; return p2(hh) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()) + ' ' + ap; };
  const fmtDur = ms => { const s = Math.round(ms / 1000); return p2(s / 3600 | 0) + ' h ' + p2((s % 3600) / 60 | 0) + ' min ' + p2(s % 60) + ' s'; };
  const max = Q.length * CFG.plus, att = C + W, acc = att ? Math.round(C * 100 / att) : 0;
  const pc = (a, b) => b ? Math.round(a * 100 / b) : 0;
  const lvl = p => p >= 70 ? ['Strong', '#16a34a'] : p >= 40 ? ['Improving', '#d97706'] : ['Focus area', '#0891b2'];
  const subjQ = {}, topic = {};
  for (const k in SUB) subjQ[k] = Q.filter(q => q.s === k).length;
  Q.forEach((q, i) => {
    const n = TOPIC_NAMES[TOPIC[Q[i].id]] || 'General', t = topic[n] = topic[n] || { s: q.s, tot: 0, c: 0, w: 0, u: 0 };
    t.tot++; t[STAT[i]]++;
  });
  const ks = Object.keys(SUB).sort((a, b) => T[b].m - T[a].m);
  const best = ks[0], low = ks[ks.length - 1];
  const R = 38, CI = 2 * Math.PI * R, ring = CI * Math.max(0, tot) / max;

  const subjCards = Object.keys(SUB).map(k => {
    const t = T[k], n = subjQ[k], p = pc(t.c, n), L = lvl(p);
    const tag = k === best && t.m > 0 ? '⭐ Your strongest subject' : k === low && ks.length > 1 ? '🎯 Biggest room to grow' : '';
    return '<div class="sc"><div class="sh"><b>' + SUB[k] + '</b><span style="background:' + L[1] + '">' + L[0] + '</span></div>' +
      '<div class="sm">' + t.m + ' <small>marks</small></div>' +
      '<div class="bar"><i style="width:' + pc(t.c, n) + '%;background:#16a34a"></i><i style="width:' + pc(t.w, n) + '%;background:#f59e0b"></i><i style="width:' + pc(t.u, n) + '%;background:#94a3b8"></i></div>' +
      '<div class="lg2"><span><b style="color:#16a34a">' + t.c + '</b> correct</span><span><b style="color:#d97706">' + t.w + '</b> wrong</span><span><b style="color:#64748b">' + t.u + '</b> skipped</span></div>' +
      '<div class="tg">' + tag + '&nbsp;</div></div>';
  }).join('');

  const tops = Object.entries(topic).map(([n, t]) => ({ ...t, name: n, p: pc(t.c, t.tot) }));
  const topRows = Object.keys(SUB).map(k => '<div class="th">' + SUB[k] + '</div>' + tops.filter(t => t.s === k).sort((a, b) => b.p - a.p).map(t => {
    const L = lvl(t.p);
    return '<div class="tr"><span class="tn">' + t.name + '</span><span class="tb"><i style="width:' + Math.max(t.p, 3) + '%;background:' + L[1] + '"></i></span><span class="tp">' + t.c + '/' + t.tot + '</span></div>';
  }).join('')).join('');

  const kind = i => Q[i].t === 'n' ? 'n' : /Statement|Assertion/.test(Q[i].q) ? 's' : 'm';
  const KN = { n: 'Numerical questions', s: 'Statement / Assertion–Reason questions', m: 'Concept-based MCQs' };
  const KT = {
    n: 'Write each step on paper and re-check units and the final arithmetic before entering the number.',
    s: 'Judge each statement separately as true/false first, then choose the matching option — avoid deciding from just one statement.',
    m: 'Revise the theory and standard results of the topics on the left, then practise 10 MCQs per topic.'
  };
  const pat = ['n', 's', 'm'].map(x => {
    const idx = Q.map((_, i) => i).filter(i => kind(i) === x), w = idx.filter(i => STAT[i] === 'w').length, u = idx.filter(i => STAT[i] === 'u').length, c = idx.filter(i => STAT[i] === 'c').length;
    if (!idx.length || w + u === 0) return '';
    return '<div class="pt"><b>' + KN[x] + '</b> — ' + c + ' correct, ' + w + ' wrong, ' + u + ' skipped<br><span>' + KT[x] + '</span></div>';
  }).join('') || '<div class="pt"><b>Excellent!</b> No mistakes to analyse.</div>';

  const need = tops.filter(t => t.p < 70).sort((a, b) => a.p - b.p || b.tot - a.tot).slice(0, 3);
  const strong = tops.filter(t => t.p >= 70).sort((a, b) => b.p - a.p).slice(0, 3);
  const skipNote = U ? '<div class="pt"><b>' + U + ' skipped</b> — a skipped question is an opportunity, not a failure. Revisit them first (solutions are in this report) and practise answering within a time limit.</div>' : '';
  const plan = (need.length ? '<ol>' + need.map(t => '<li><b>' + t.name + '</b> (' + SUB[t.s] + ') — ' + t.c + ' of ' + t.tot + ' correct. Re-read the concept notes, then solve the questions marked with this topic in the pages that follow.</li>').join('') + '</ol>' : '<p>You are strong in every topic — keep practising mixed full-length tests to stay sharp.</p>') +
