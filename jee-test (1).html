<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE Main Mock Test</title>
<style>
:root{--n9:#061a33;--n8:#0b2545;--c5:#06b6d4;--c3:#67e8f9;--bg:#f1f9fc;--mut:#5a7291;--ok:#16a34a;--bad:#dc2626;--mk:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--n8);user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(6,26,51,.15);padding:28px;max-width:600px;width:100%}
h1{margin:0 0 4px;font-size:24px}h2{margin:0 0 10px;font-size:19px}h4{margin:14px 0 6px;font-size:13px;color:var(--mut)}
ul{padding-left:18px;line-height:1.65;font-size:14px;color:#33496a}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--c5);color:var(--n9)}
.btn.sec{background:#e2eef5;color:var(--n8)}.btn.red{background:var(--bad);color:#fff}
header{background:var(--n8);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px}
.timer{font:700 22px ui-monospace,Consolas,monospace;color:var(--c3)}.timer.low{color:#fca5a5}
.tabs{display:flex;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid #d6e8f0}
.tab{border:1px solid #cfe3ec;background:#fff;border-radius:20px;padding:6px 16px;font-weight:600;cursor:pointer;color:var(--n8)}
.tab.on{background:var(--c5);border-color:var(--c5);color:var(--n9)}
.main{display:grid;grid-template-columns:1fr 290px;gap:16px;padding:16px 18px}
.q{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(6,26,51,.08)}
.qh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px}
#qtext{font-size:18px;line-height:1.55;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:#f6fbfd;border:2px solid #d6e8f0;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:16px;cursor:pointer;color:var(--n8)}
.opt b{display:inline-block;width:26px;color:var(--c5)}.opt.sel{border-color:var(--c5);background:#e0f7fb}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
aside{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(6,26,51,.08);align-self:start}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pb{border:1px solid #cbd9e2;background:#eef3f6;border-radius:8px;height:36px;font-weight:700;cursor:pointer;color:var(--n8);display:inline-block;min-width:36px;text-align:center;line-height:34px}
.pb.a{background:var(--ok);color:#fff;border-color:var(--ok)}.pb.v{background:var(--bad);color:#fff;border-color:var(--bad)}
.pb.m{background:var(--mk);color:#fff;border-color:var(--mk)}.pb.cur{outline:3px solid var(--c5)}
.leg{font-size:12px;color:var(--mut);margin-top:14px;line-height:2.1}.leg .pb{height:22px;min-width:22px;line-height:20px;font-size:11px;cursor:default}
.ov{position:fixed;inset:0;background:rgba(6,26,51,.9);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:28px;max-width:440px;width:100%;text-align:center}
.big{font-size:68px;font-weight:800;color:var(--bad);line-height:1.1;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}th,td{padding:8px;border-bottom:1px solid #e1edf3;text-align:center}th:first-child,td:first-child{text-align:left}
.score{font-size:44px;font-weight:800;color:var(--c5)}
details{margin-top:12px;font-size:14px}.rv{padding:8px 0;border-bottom:1px solid #e1edf3;line-height:1.5}
.g{color:var(--ok);font-weight:700}.r{color:var(--bad);font-weight:700}
@media(max-width:820px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="start" class="center"><div class="card">
  <h1>JEE Main Mock Test</h1>
  <p style="margin:0 0 8px;color:var(--mut)">Physics • Chemistry • Mathematics</p>
  <ul id="rules"></ul>
  <button class="btn" id="go" style="width:100%;margin-top:10px;font-size:16px">START EXAM</button>
</div></div>

<div id="exam" class="hidden">
  <header>
    <b>JEE Main Mock Test</b>
    <span id="viol">Warnings: 0</span>
    <span class="timer" id="timer">00:00:00</span>
    <button class="btn red" id="subBtn">Submit Paper</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="main">
    <section class="q">
      <div class="qh"><span id="qno"></span><span id="qsub"></span></div>
      <p id="qtext"></p>
      <div id="opts"></div>
      <div class="nav">
        <button class="btn sec" id="prev">Previous</button>
        <button class="btn sec" id="mark">Mark for Review &amp; Next</button>
        <button class="btn sec" id="clr">Clear Answer</button>
        <button class="btn" id="next">Save &amp; Next</button>
      </div>
    </section>
    <aside id="pal"></aside>
  </div>
</div>

<div id="result" class="center hidden"></div>

<div id="alert" class="ov hidden"><div class="box">
  <h2 id="aT"></h2><p id="aM" style="color:var(--mut)"></p>
  <div class="big" id="aC"></div>
  <button class="btn" id="aB" style="width:100%">RETURN TO EXAM (FULL SCREEN)</button>
</div></div>

<div id="conf" class="ov hidden"><div class="box">
  <h2>Submit the paper?</h2><p id="cM" style="color:var(--mut)"></p>
  <button class="btn sec" id="cN">Cancel</button> <button class="btn red" id="cY">Yes, Submit</button>
</div></div>

<script>
// ===== Settings (change freely) =====
const CFG = { minutes: 60, grace: 15, final: 10, plus: 4, minus: 1, perSubject: 5 };  // perSubject = questions picked per subject each attempt

// ===== Question BANK: every attempt picks CFG.perSubject random questions per subject from here and shuffles the options.
// Add more objects in the same format (s = P / C / M, a = index of correct option 0-3). Avoid options like "Both A and B". =====
const SUB = { P: 'Physics', C: 'Chemistry', M: 'Mathematics' };
const BANK = [
 {s:'P',q:'A ball is thrown vertically upwards with a speed of 20 m/s. Taking g = 10 m/s², the maximum height reached is',o:['10 m','20 m','30 m','40 m'],a:1},
 {s:'P',q:'The dimensional formula of Planck’s constant h is',o:['ML²T⁻¹','ML²T⁻²','MLT⁻¹','ML⁻¹T'],a:0},
 {s:'P',q:'Two resistors of 6 Ω and 3 Ω are connected in parallel. The equivalent resistance is',o:['9 Ω','2 Ω','1.5 Ω','4.5 Ω'],a:1},
 {s:'P',q:'A body of mass 2 kg is moving with a speed of 3 m/s. Its kinetic energy is',o:['3 J','6 J','9 J','18 J'],a:2},
 {s:'P',q:'A simple pendulum of length 1 m is placed where g = π² m/s². Its time period is',o:['1 s','2 s','π s','2π s'],a:1},
 {s:'C',q:'The number of unpaired electrons in a phosphorus atom (Z = 15) in its ground state is',o:['1','2','3','5'],a:2},
 {s:'C',q:'The pH of a 0.01 M aqueous solution of HCl is',o:['1','2','3','12'],a:1},
 {s:'C',q:'The hybridisation of carbon atoms in ethyne (C₂H₂) is',o:['sp','sp²','sp³','sp³d'],a:0},
 {s:'C',q:'The number of moles present in 36 g of water (molar mass 18 g/mol) is',o:['1','2','3','4'],a:1},
 {s:'C',q:'The IUPAC name of CH₃–CH₂–CH₂–OH is',o:['Propan-2-ol','Propanal','Propan-1-ol','Propanone'],a:2},
 {s:'M',q:'If f(x) = x², then the value of f′(3) is',o:['3','6','9','12'],a:1},
 {s:'M',q:'The value of ∫₀^π sin x dx is',o:['0','1','2','π'],a:2},
 {s:'M',q:'Two fair coins are tossed. The probability of getting at least one head is',o:['1/4','1/2','3/4','1'],a:2},
 {s:'M',q:'The determinant of the matrix [[1, 2], [3, 4]] is',o:['−2','2','10','−10'],a:0},
 {s:'M',q:'The sum of the roots of the equation 2x² − 7x + 3 = 0 is',o:['3/2','7/2','−7/2','2/7'],a:1},
 {s:'P',q:'A car accelerates uniformly from rest to 20 m/s in 5 s. Its acceleration is',o:['2 m/s²','4 m/s²','5 m/s²','10 m/s²'],a:1},
 {s:'P',q:'The SI unit of capacitance is',o:['Henry','Farad','Tesla','Weber'],a:1},
 {s:'P',q:'A force of 10 N acts on a body of mass 2 kg. The acceleration produced is',o:['2 m/s²','5 m/s²','10 m/s²','20 m/s²'],a:1},
 {s:'P',q:'The speed of light in a medium of refractive index 1.5 is (c = 3 × 10⁸ m/s)',o:['1.5 × 10⁸ m/s','2 × 10⁸ m/s','3 × 10⁸ m/s','4.5 × 10⁸ m/s'],a:1},
 {s:'P',q:'A wire of resistance 10 Ω carries a current of 2 A. The heat produced per second is',o:['20 J','40 J','5 J','80 J'],a:1},
 {s:'P',q:'A wave has wavelength 2 m and speed 340 m/s. Its frequency is',o:['170 Hz','680 Hz','340 Hz','85 Hz'],a:0},
 {s:'P',q:'The work done by a constant force of 5 N in moving a body 4 m along the direction of the force is',o:['9 J','20 J','1.25 J','40 J'],a:1},
 {s:'P',q:'Which of the following is a vector quantity?',o:['Mass','Temperature','Displacement','Time'],a:2},
 {s:'P',q:'The pressure due to water alone at a depth of 10 m is (ρ = 1000 kg/m³, g = 10 m/s²)',o:['10³ Pa','10⁴ Pa','10⁵ Pa','10⁶ Pa'],a:2},
 {s:'P',q:'The power of a convex lens of focal length 20 cm is',o:['+5 D','+0.5 D','+20 D','−5 D'],a:0},
 {s:'C',q:'Which of the following is a noble gas?',o:['Nitrogen','Oxygen','Argon','Chlorine'],a:2},
 {s:'C',q:'The molecular formula of glucose is',o:['C₆H₁₂O₆','C₁₂H₂₂O₁₁','C₆H₆','CH₃COOH'],a:0},
 {s:'C',q:'The oxidation state of manganese in KMnO₄ is',o:['+2','+4','+6','+7'],a:3},
 {s:'C',q:'Which element has the highest electronegativity?',o:['Chlorine','Fluorine','Oxygen','Nitrogen'],a:1},
 {s:'C',q:'The total number of σ bonds in an ethene (C₂H₄) molecule is',o:['4','5','6','3'],a:1},
 {s:'C',q:'The approximate value of Avogadro’s number is',o:['6.022 × 10²³','6.022 × 10²⁰','3.011 × 10²³','1.6 × 10⁻¹⁹'],a:0},
 {s:'C',q:'The gas evolved when zinc reacts with dilute hydrochloric acid is',o:['Oxygen','Chlorine','Hydrogen','Carbon dioxide'],a:2},
 {s:'C',q:'The shape of the NH₃ molecule is',o:['Linear','Trigonal planar','Trigonal pyramidal','Tetrahedral'],a:2},
 {s:'C',q:'Which of the following is an amphoteric oxide?',o:['Na₂O','Al₂O₃','CO₂','MgO'],a:1},
 {s:'C',q:'The pH of pure water at 25 °C is',o:['0','1','7','14'],a:2},
 {s:'M',q:'The value of sin 30° is',o:['√3/2','1/2','1','1/√2'],a:1},
 {s:'M',q:'If A = {1, 2, 3} and B = {2, 3, 4}, then n(A ∪ B) is',o:['2','3','4','6'],a:2},
 {s:'M',q:'The derivative of ln x with respect to x is',o:['x','1/x','ln x','eˣ'],a:1},
 {s:'M',q:'The sum of the first 10 natural numbers is',o:['45','50','55','100'],a:2},
 {s:'M',q:'The distance between the points (0, 0) and (3, 4) is',o:['3','4','5','7'],a:2},
 {s:'M',q:'The value of ∫₀³ 2x dx is',o:['3','6','9','18'],a:2},
 {s:'M',q:'If log₁₀ x = 2, then x equals',o:['20','100','1000','2'],a:1},
 {s:'M',q:'The number of ways of arranging 3 distinct books on a shelf is',o:['3','6','9','27'],a:1},
 {s:'M',q:'The modulus of the complex number 1 + i is',o:['1','√2','2','0'],a:1},
 {s:'M',q:'The common difference of the A.P. 5, 8, 11, 14, … is',o:['2','3','4','5'],a:1}
];

// Build this attempt's paper: random questions per subject + shuffled options (new paper on every reload)
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const Q = [];
for (const k in SUB) {
  shuffle(BANK.filter(x => x.s === k)).slice(0, CFG.perSubject).forEach(x => {
    const ord = shuffle(x.o.map((_, i) => i));
    Q.push({ s: k, q: x.q, o: ord.map(i => x.o[i]), a: ord.indexOf(x.a) });
  });
}

const $ = id => document.getElementById(id);
let ans = Q.map(() => -1), seen = Q.map(() => false), mk = Q.map(() => false);
let cur = 0, run = false, endAt = 0, viol = 0, vN = 0, ac, beepT, tickT;

$('rules').innerHTML =
  '<li>' + Q.length + ' questions • ' + CFG.minutes + ' minutes • +' + CFG.plus + ' for correct, −' + CFG.minus + ' for wrong</li>' +
  '<li>Every attempt has a <b>fresh, random set of questions</b>.</li>' +
  '<li>Clicking <b>Start Exam</b> starts the timer and switches your screen to <b>full screen</b>.</li>' +
  '<li>If you leave the exam screen (exit full screen, switch tab or window), an <b>alarm</b> will sound.</li>' +
  '<li>You get <b>' + CFG.grace + ' seconds</b> to come back. Otherwise a warning appears and the paper is <b>auto-submitted after ' + CFG.final + ' more seconds</b>.</li>';

// ===== Paper UI =====
function go(i) { cur = i; seen[i] = true; render(); }

function render() {
  const q = Q[cur];
  $('qno').textContent = 'Question ' + (cur + 1) + ' of ' + Q.length;
  $('qsub').textContent = SUB[q.s] + ' • +' + CFG.plus + ' / −' + CFG.minus;
  $('qtext').textContent = q.q;
  $('opts').innerHTML = q.o.map((t, i) =>
    '<button class="opt' + (ans[cur] === i ? ' sel' : '') + '" data-i="' + i + '"><b>' + 'ABCD'[i] + '</b>' + t + '</button>').join('');
  $('tabs').innerHTML = Object.keys(SUB).map(k =>
    '<button class="tab' + (k === q.s ? ' on' : '') + '" data-s="' + k + '">' + SUB[k] + '</button>').join('');
  let h = '';
  for (const k in SUB) {
    h += '<h4>' + SUB[k] + '</h4><div class="grid">';
    Q.forEach((x, i) => {
      if (x.s !== k) return;
      const c = mk[i] ? 'm' : ans[i] >= 0 ? 'a' : seen[i] ? 'v' : '';
      h += '<button class="pb ' + c + (i === cur ? ' cur' : '') + '" data-i="' + i + '">' + (i + 1) + '</button>';
    });
    h += '</div>';
  }
  h += '<div class="leg"><span class="pb a">✓</span> Answered <span class="pb v">•</span> Not answered<br><span class="pb m">★</span> Marked <span class="pb">–</span> Not visited</div>';
  $('pal').innerHTML = h;
}

$('opts').onclick = e => { const b = e.target.closest('.opt'); if (b) { ans[cur] = +b.dataset.i; render(); } };
$('pal').onclick = e => { const b = e.target.closest('.pb[data-i]'); if (b) go(+b.dataset.i); };
$('tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) go(Q.findIndex(x => x.s === b.dataset.s)); };
$('next').onclick = () => go(Math.min(cur + 1, Q.length - 1));
$('prev').onclick = () => go(Math.max(cur - 1, 0));
$('mark').onclick = () => { mk[cur] = true; go(Math.min(cur + 1, Q.length - 1)); };
$('clr').onclick = () => { ans[cur] = -1; mk[cur] = false; render(); };

$('subBtn').onclick = () => {
  const done = ans.filter(a => a >= 0).length;
  $('cM').textContent = 'You have answered ' + done + ' of ' + Q.length + ' questions. This cannot be undone.';
  $('conf').classList.remove('hidden');
};
$('cN').onclick = () => $('conf').classList.add('hidden');
$('cY').onclick = () => submit('You submitted the paper.');

// ===== Start: full screen + timer =====
$('go').onclick = () => {
  const el = document.documentElement;
  (el.requestFullscreen ? el.requestFullscreen() : Promise.reject()).then(begin).catch(() =>
    alert('Full screen could not be started. Please open this page in a normal browser tab on a computer and try again.'));
};

function begin() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  $('start').classList.add('hidden');
  $('exam').classList.remove('hidden');
  run = true;
  endAt = Date.now() + CFG.minutes * 60000;
  go(0);
  tickT = setInterval(tick, 250);
  tick();
}

// ===== Alarm sound =====
function beep() {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.25;
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + 0.3);
}
function startBeep() { beep(); beepT = setInterval(beep, 600); }
function stopBeep() { clearInterval(beepT); }

// ===== Leaving-screen detection =====
function chk() {
  if (!run) return;
  const ok = !!document.fullscreenElement && !document.hidden && document.hasFocus();
  if (!ok && !viol) {
    viol = Date.now(); vN++;
    $('viol').textContent = 'Warnings: ' + vN;
    $('alert').classList.remove('hidden');
    startBeep(); tick();
  } else if (ok && viol) {
    viol = 0;
    $('alert').classList.add('hidden');
    stopBeep();
  }
}
['fullscreenchange', 'visibilitychange'].forEach(e => document.addEventListener(e, chk));
['blur', 'focus'].forEach(e => addEventListener(e, chk));
$('aB').onclick = () => {
  const p = document.documentElement.requestFullscreen();
  if (p && p.then) p.then(chk).catch(chk); else chk();
};

// ===== Timer + violation countdown (uses real time, so background throttling cannot cheat it) =====
function tick() {
  const now = Date.now(), left = Math.max(0, endAt - now), s = Math.ceil(left / 1000);
  $('timer').textContent = [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(x => String(x).padStart(2, '0')).join(':');
  $('timer').classList.toggle('low', s < 300);
  if (left <= 0) { submit('Time is up. Your paper was submitted automatically.'); return; }
  if (viol) {
    const e = (now - viol) / 1000;
    if (e >= CFG.grace + CFG.final) { submit('You stayed away from the exam screen, so your paper was auto-submitted.'); return; }
    if (e >= CFG.grace) {
      $('aT').textContent = '⚠ Your paper will be submitted!';
      $('aM').textContent = 'You did not return to the exam screen. Auto-submit in';
      $('aC').textContent = Math.ceil(CFG.grace + CFG.final - e);
    } else {
      $('aT').textContent = '⚠ You left the exam screen!';
      $('aM').textContent = 'Return to the exam screen within';
      $('aC').textContent = Math.ceil(CFG.grace - e);
    }
  }
}

// ===== Submit + result =====
function submit(msg) {
  if (!run) return;
  run = false; clearInterval(tickT); stopBeep();
  ['alert', 'conf'].forEach(i => $(i).classList.add('hidden'));
  if (document.fullscreenElement) document.exitFullscreen();
  const T = {}; let tot = 0;
  for (const k in SUB) T[k] = { c: 0, w: 0, u: 0, m: 0 };
  Q.forEach((q, i) => {
    const t = T[q.s];
    if (ans[i] < 0) t.u++;
    else if (ans[i] === q.a) { t.c++; t.m += CFG.plus; }
    else { t.w++; t.m -= CFG.minus; }
  });
  let rows = '';
  for (const k in SUB) { tot += T[k].m; rows += '<tr><td>' + SUB[k] + '</td><td>' + T[k].c + '</td><td>' + T[k].w + '</td><td>' + T[k].u + '</td><td><b>' + T[k].m + '</b></td></tr>'; }
  const rv = Q.map((q, i) => {
    const yours = ans[i] < 0 ? '<span style="color:var(--mut)">Not attempted</span>' : (ans[i] === q.a ? '<span class="g">' + 'ABCD'[ans[i]] + ' ✓</span>' : '<span class="r">' + 'ABCD'[ans[i]] + ' ✗</span>');
    return '<div class="rv"><b>Q' + (i + 1) + '.</b> ' + q.q + '<br>Your answer: ' + yours + ' &nbsp;|&nbsp; Correct: <b>' + 'ABCD'[q.a] + '. ' + q.o[q.a] + '</b></div>';
  }).join('');
  $('exam').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('result').innerHTML = '<div class="card"><h1>Test Submitted</h1><p style="color:var(--mut)">' + msg + '</p>' +
    '<div class="score">' + tot + ' <span style="font-size:20px;color:var(--mut)">/ ' + Q.length * CFG.plus + '</span></div>' +
    '<table><tr><th>Subject</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Marks</th></tr>' + rows + '</table>' +
    '<p style="font-size:13px;color:var(--mut)">Warnings (times you left the screen): ' + vN + '</p>' +
    '<details><summary style="cursor:pointer;font-weight:700">Review answers</summary>' + rv + '</details>' +
    '<button class="btn" style="width:100%;margin-top:16px" onclick="location.reload()">Take test again</button></div>';
}

// ===== Basic protection =====
addEventListener('beforeunload', e => { if (run) { e.preventDefault(); e.returnValue = ''; } });
['contextmenu', 'copy', 'cut', 'paste'].forEach(e => document.addEventListener(e, ev => { if (run) ev.preventDefault(); }));
</script>
</body>
</html>
